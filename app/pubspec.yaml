name: tally
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  async: ^2.13.0
  crypto: ^3.0.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  # MUST stay `any`: flutter_localizations pins intl to an exact version
  # (0.20.2 on Flutter 3.44.2). A caret range fails version solving.
  intl: any
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Runs `flutter gen-l10n` (see l10n.yaml) on `flutter pub get` / `flutter run`.
  generate: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
