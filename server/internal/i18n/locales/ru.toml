# Tally Telegram bot — русский каталог.
#
# Плюрализация: русский требует полного набора CLDR one/few/many/other.
#   one  — 1, 21, 101   (i%10==1 && i%100!=11)
#   few  — 2, 22, 103   (i%10∈2..4 && i%100∉12..14)
#   many — 5, 11, 111   (всё остальное)

# --- general ---------------------------------------------------------------

[start]
other = """
👋 Tally — записывайте траты за 3 секунды.

Просто отправьте сообщение:
  250 продукты за неделю
  250.50 такси
  +50000 зарплата

Первое слово — сумма (+ означает доход), второе выбирает категорию, остальное станет заметкой.

Команды:
/today  /week  /month — сводки
/undo — удалить последнюю запись
/categories — список категорий
/accounts — балансы счетов"""

[unauthorized]
other = "⛔ Нет доступа."

[unknown_command]
other = "🤔 Неизвестная команда. Отправьте /start для справки."

# --- entry -----------------------------------------------------------------

[hint_amount]
other = """
🤔 Не удалось прочитать сумму. Попробуйте так:
250 продукты за неделю
250.50 такси
+50000 зарплата"""

[pick_category]
other = "Выберите категорию для {{.Amount}}:"

