# Tally Telegram boti — oʻzbekcha katalog (lotin yozuvi).
#
# Koʻplik: oʻzbek tilida ingliz tilidagidek one/other yetarli (one — n = 1).
# Amalda son bilan kelgan ot oʻzgarmaydi, shuning uchun ikkala shakl bir xil
# boʻlishi mumkin — lekin go-i18n xato bermasligi uchun ikkalasi ham kerak.
#
# Tutuq belgisi sifatida ʻ (U+02BB) ishlatiladi, ASCII ' emas.

# --- general ---------------------------------------------------------------

[start]
other = """
👋 Tally — pulni 3 soniyada yozib qoʻying.

Shunchaki xabar yuboring:
  250 oziq-ovqat haftalik xarid
  250.50 taksi
  +50000 maosh

Birinchi soʻz — summa (+ daromadni bildiradi), ikkinchisi turkumni tanlaydi, qolgani izohga aylanadi.

Buyruqlar:
/today  /week  /month — hisobotlar
/undo — oxirgi yozuvni oʻchirish
/categories — turkumlar roʻyxati
/accounts — hisob balanslari"""

[unauthorized]
other = "⛔ Ruxsat yoʻq."

[unknown_command]
other = "🤔 Notanish buyruq. Yordam uchun /start yuboring."

